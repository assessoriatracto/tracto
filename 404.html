<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | Tracto</title>
<script>
// formulários criados no construtor: /aplicar/<slug>/ → /aplicar/?s=<slug> (mantém UTMs e parâmetros)
(function () {
  var m = location.pathname.match(/^\/aplicar\/([a-z0-9-]{1,40})\/?$/);
  if (m) location.replace('/aplicar/?s=' + m[1] + (location.search ? '&' + location.search.slice(1) : '') + location.hash);
})();
</script>
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/css/app.css?v=3">
<style>
  body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;}
  h1{font-size:clamp(28px,5vw,44px);font-weight:400;margin:24px 0 10px;}
  p{color:var(--gray-2);margin:0 0 28px;}
</style>
</head>
<body>
  <main>
    <img src="/assets/img/tracto-logo.svg?v=3" alt="Tracto" style="height:34px;margin:0 auto">
    <h1>Página <em>não encontrada</em></h1>
    <p>O endereço pode ter mudado.</p>
    <a class="btn btn-pill" href="/">IR PARA O SITE <span class="chev">›</span></a>
  </main>
</body>
</html>
